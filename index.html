:root{

}

  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif}

}

.timeItem{display:grid;grid-template-columns:34px 1fr;gap:8px;min-height:138px}

.spacer{flex:1}

.selfHero{padding:26px 0 18px}

.mindRow{padding:18px 0;border-top:1px solid rgba(255,255,255,.08)}
.mindRowTop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mindName{font-size:16px;font-weight:780;letter-spacing:.4px}
.mindMeta{font-size:11px;color:var(--muted)}
.bar{height:3px;background:#1b1e28;border-radius:999px;margin-top:11px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--blue));border-radius:999px}
.evidence{font-size:13px;line-height:1.5;color:var(--muted);margin-top:9px}
.shiftCard{border:1px solid rgba(141,184,255,.2);border-radius:20px;padding:17px;margin-top:10px;background:rgba(141,184,255,.035)}

.constellation{position:relative;height:330px;margin:18px 0 28px;border:1px solid var(--line);border-radius:28px;overflow:hidden;background:radial-gradient(circle at 50% 45%,rgba(119,91,255,.12),transparent 42%)}
.constellation svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mindNode{position:absolute;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:#0b0d13;color:var(--text);font-size:9px;font-weight:800;letter-spacing:.6px;box-shadow:0 0 24px rgba(120,120,255,.08)}
.mindNode.active{border-color:rgba(163,151,255,.65);box-shadow:0 0 28px rgba(125,105,255,.24)}

.insightBtn{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.025);color:var(--text);padding:17px;margin-top:10px}
.insightBtn .head{font-size:10px;letter-spacing:1.2px;color:var(--blue);font-weight:800}
.insightBtn .body{font-size:16px;line-height:1.45;font-weight:720;margin-top:7px}
.insightBtn .tap{font-size:11px;color:var(--faint);margin-top:9px}
.evidenceSheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.72);display:flex;align-items:flex-end}
.evidencePanel{width:100%;max-height:82vh;overflow:auto;background:#0d0f15;border-top:1px solid var(--line);border-radius:28px 28px 0 0;padding:24px 20px 36px}
.quoteCard{border-left:2px solid rgba(163,151,255,.55);padding:4px 0 4px 14px;margin:18px 0}
.quoteText{font-size:15px;line-height:1.55}

/* ECHO 0.8 — unified visual language */
.screen{animation:echoIn .42s ease both}
@keyframes echoIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.questionCard,.compareCard,.domainCard,.timelineCard,.futureCard{background:transparent!important;border:0!important;border-radius:0!important}
textarea,input{background:#0d0f15!important;border:1px solid rgba(255,255,255,.09)!important;border-radius:18px!important;color:var(--text)!important}
textarea:focus,input:focus{border-color:rgba(156,147,255,.38)!important;box-shadow:0 0 0 3px rgba(132,120,255,.06)!important}
.questionText{font-weight:430!important;letter-spacing:-.6px!important;line-height:1.18!important}
.progressTrack{height:2px!important;background:rgba(255,255,255,.06)!important}
.progressFill{background:linear-gradient(90deg,#8078e8,#b0aaff)!important}
.cta{border-radius:18px!important;min-height:52px!important;font-weight:620!important}
.backBtn,.navLink{letter-spacing:1px!important}
.rangeWrap{background:transparent!important;border-top:1px solid var(--line)!important;border-bottom:1px solid var(--line)!important;border-radius:0!important;padding:18px 0!important}
input[type=range]{background:transparent!important;border:0!important}
.echoDivider{height:1px;background:linear-gradient(90deg,transparent,rgba(150,141,255,.3),transparent);margin:28px 0}
.thenNow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}
.timeSide{min-width:0;border:1px solid var(--line);border-radius:20px;padding:16px;background:rgba(255,255,255,.018)}
.timeSide .when{font-size:9px;letter-spacing:2px;color:#8f8aaf}
.timeSide .answer{font-size:13px;line-height:1.5;margin-top:10px;word-break:break-word}
.timelineLine{position:relative;padding-left:24px;margin-top:20px}
.timelineLine:before{content:"";position:absolute;left:5px;top:5px;bottom:5px;width:1px;background:linear-gradient(#8179e7,rgba(255,255,255,.06))}
.timelinePoint{position:relative;padding:0 0 26px 0}
.timelinePoint:before{content:"";position:absolute;left:-22px;top:5px;width:7px;height:7px;border-radius:50%;background:#aaa4ff;box-shadow:0 0 14px rgba(151,142,255,.7)}
.topicHero{padding:30px 0 16px}

.topicStat b{display:block;font-size:22px;font-weight:500}.topicStat span{font-size:9px;color:var(--faint);letter-spacing:1.5px}

/* ECHO 0.10.10 — reference composition.
   Artwork supplied by the owner. SVG masks expose only decorative regions;
   headings, feature labels, icons and controls below are live HTML/SVG. */
.landingScreen{padding:0;background:#03070c;overflow:hidden;isolation:isolate;--u:min(.140647vw,.675105px)}
.landingScreen .wrap{max-width:480px;min-height:100svh;padding:calc(env(safe-area-inset-top) + 37 * var(--u)) calc(44 * var(--u)) calc(env(safe-area-inset-bottom) + 38 * var(--u));position:relative}
.referenceBackdrop{position:absolute;left:0;right:0;top:calc(-60 * var(--u));z-index:0;pointer-events:none;overflow:hidden;aspect-ratio:711/1100;background:radial-gradient(ellipse at 50% 10%,#08101b,transparent 58%),#02060b}
.referenceBackdrop svg{display:block;width:100%;height:auto}
.referenceBackdrop:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 80%,#03070c 94%)}
.landingTop,.landingCopy,.landingActions{position:relative;z-index:2}
.landingTop{padding-left:calc(10 * var(--u))}
.landingMicro{font-size:calc(14 * var(--u));line-height:calc(18 * var(--u));letter-spacing:calc(4.2 * var(--u));color:#a0a8b2;margin-bottom:calc(32 * var(--u))}
.landingBrand{font-size:calc(59 * var(--u));line-height:calc(70 * var(--u));font-weight:400;letter-spacing:calc(27 * var(--u));color:#f4f5f9;text-shadow:0 0 14px #a7c7ff35}
.landingSub{font-size:calc(18 * var(--u));line-height:calc(22 * var(--u));letter-spacing:calc(5 * var(--u));color:#a3afc0;margin-top:calc(7 * var(--u));white-space:nowrap}
.landingNote{position:absolute;right:0;top:0;border-left:1px solid #707885;padding-left:calc(19 * var(--u));font-size:calc(11 * var(--u));line-height:1.5;letter-spacing:calc(1.7 * var(--u));color:#929ba8}
.landingTime{position:absolute;z-index:2;top:calc(307 * var(--u));right:calc(44 * var(--u));display:flex;flex-direction:column;align-items:center;gap:calc(14 * var(--u));color:#b3bac5;font-size:calc(12 * var(--u));letter-spacing:calc(2.4 * var(--u));line-height:1.3}
.landingTime i{width:1px;height:calc(17 * var(--u));background:#9ba5b277}
.landingCopy{margin-top:calc(340 * var(--u));padding:0 calc(10 * var(--u))}
.landingCopy h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(32px,calc(64 * var(--u)),44px);line-height:1;letter-spacing:calc(-2.7 * var(--u));font-weight:400;max-width:100%;color:#f5f5f5}
.landingCopy h1 span{color:#858b99}
.landingCopy p{font-size:clamp(13px,calc(24 * var(--u)),16px);line-height:1.36;color:#abb1bd;max-width:calc(505 * var(--u));margin-top:calc(22 * var(--u));letter-spacing:.15px}
.landingFeatures{display:flex;justify-content:space-between;gap:8px;margin-top:calc(36 * var(--u))}
.landingFeature{width:calc(116 * var(--u));text-align:center;flex-shrink:0}
.landingIcon{width:calc(96 * var(--u));height:calc(94 * var(--u));margin:auto;border:1px solid #6c73813b;border-top-color:#9fa9bb38;border-radius:calc(26 * var(--u));display:grid;place-items:center;background:linear-gradient(135deg,#10172042,#070c134a);box-shadow:inset 0 0 14px #a6c5ff05;color:#e1e6ef}
.landingIcon svg{width:calc(39 * var(--u));height:calc(39 * var(--u));stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px #ffffff15)}
.landingFeature span{display:block;font-size:clamp(7px,calc(14 * var(--u)),10px);line-height:1.45;letter-spacing:calc(1.8 * var(--u));color:#d3d8e1;margin-top:calc(12 * var(--u))}
.landingActions{margin-top:calc(62 * var(--u));padding-bottom:6px}
.landingPrimary,.landingSecondary{width:100%;min-height:44px;height:calc(82 * var(--u));border-radius:calc(28 * var(--u));font-size:clamp(14px,calc(26 * var(--u)),18px);cursor:pointer}
.landingPrimary{position:relative;background:linear-gradient(120deg,#eef0f3,#f9f9fa);color:#0c0e13;border:1px solid #fff;font-weight:650}
.landingPrimary:after{content:"→";position:absolute;right:calc(29 * var(--u));font-size:calc(36 * var(--u));top:50%;transform:translateY(-53%);font-weight:400}

  if(cls) e.className = cls;
  if(html) e.innerHTML = html;
  return e;
}
function fmtDate(d){
  const date = new Date(d);
  return date.toLocaleDateString("ru-RU",{day:"2-digit",month:"short",year:"numeric"}).toUpperCase();
}
function daysBetween(a,b){
  return Math.floor((new Date(b)-new Date(a))/86400000);
}
function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.style.display="block";
  setTimeout(()=>t.style.display="none",1500);
}
function go(route, opts={}){
  if(route!=="welcome" && route!=="auth" && route!=="loading" && !currentUser){route="auth";opts={};}
  if(currentUser && !accountReady && !["auth","loading"].includes(route))route="loading";
  if(route==="reset-password" && (!currentUser||!recoveryMode)){route="auth";opts={mode:"forgot"};}
  if(route==="auth" && currentUser && accountReady && !["forgot","reset"].includes(opts.mode))route=accountRoute();
  if(["birth","result"].includes(route) && !state.firstEchoDone)route="first";
  if(route==="first" && state.firstEchoDone)route="home";
  if(route==="repeat" && (!getQuestion(opts.id)||!latestAnswer(opts.id)))route="revisit";
  if(route==="compare" && (!getQuestion(opts.id)||!state.answers.some(a=>a.id===opts.oldId)||!state.answers.some(a=>a.id===opts.newId)))route="home";
  if(route==="domain" && !DOMAINS.includes(opts.domain))route="home";
  activeRoute=route;
  render(route, opts);
  window.scrollTo({top:0,behavior:"instant"});
  history.replaceState({route},"",`#${route}`);
}
function getQuestion(id){ return questions.find(q=>q.id===id); }
function answersFor(id){ return state.answers.filter(a=>a.questionId===id).sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt)); }
function latestAnswer(id){ const a=answersFor(id); return a[a.length-1] || null; }

function saveAnswer(questionId, text, confidence=70, source="normal"){
  if(!isActiveAccount(currentUser?.id)||!accountReady)return null;
  const q=getQuestion(questionId);
  const rec={
    id: newRecordId(),synced:false,
    questionId, domain:q.domain, text:text.trim(), confidence:Number(confidence),
    createdAt:new Date().toISOString(), source
  };
  state.answers.push(rec);
  delete state.drafts[source+":"+questionId];
  reconcileProgress();
  state.timeline.push({
    id:`ans_${rec.id}`,type:"ANSWER",date:rec.createdAt,domain:q.domain,
    title:source==="repeat"?"Echo revisited":"Thought saved",
    desc:q.text
  });
  saveState();
  syncAnswer(rec);
  return rec;
}

function domainStats(){
  const out={};
  DOMAINS.forEach(d=>out[d]={count:0,avgConfidence:null,last:null});
  state.answers.forEach(a=>{
    if(!out[a.domain])return;
    out[a.domain].count++;
    out[a.domain].last=a.createdAt;
  });
  DOMAINS.forEach(d=>{
    const arr=state.answers.filter(a=>a.domain===d);
    if(arr.length) out[d].avgConfidence=Math.round(arr.reduce((s,a)=>s+a.confidence,0)/arr.length);
  });
  return out;
}

function appShell(content){
  const screen=el("main","screen");
  const wrap=el("div","wrap");
  wrap.append(content);
  screen.append(wrap);
  return screen;
}

function authErrorMessage(error){
  const messages={
    invalid_credentials:"Email или пароль не совпадают. Проверь их и попробуй ещё раз.",
    email_not_confirmed:"Сначала подтверди email по ссылке в письме от ECHO.",
    user_already_exists:"Этот email уже зарегистрирован. Войди или восстанови пароль.",
    email_exists:"Этот email уже зарегистрирован. Войди или восстанови пароль.",
    weak_password:"Пароль слишком простой. Используй минимум 6 символов, буквы и цифры.",
    same_password:"Новый пароль должен отличаться от прежнего.",
    over_request_rate_limit:"Слишком много попыток. Подожди немного и попробуй снова.",
    over_email_send_rate_limit:"Письма запрошены слишком часто. Подожди несколько минут.",
    email_address_invalid:"Проверь адрес почты — похоже, в нём опечатка.",
    otp_expired:"Ссылка устарела или уже использована. Запроси новое письмо.",
    session_not_found:"Войди ещё раз, чтобы продолжить.",
    signup_disabled:"Регистрация временно недоступна. Попробуй позже."
  };
  if(messages[error?.code])return messages[error.code];
  if(error?.name==="AuthSessionMissingError")return "Ссылка больше не действует. Запроси новое письмо для смены пароля.";
  if(!navigator.onLine || /fetch|network|timeout/i.test(error?.message||""))return "Не удалось связаться с ECHO. Проверь интернет и попробуй ещё раз.";
  return "Не получилось выполнить запрос. Попробуй ещё раз чуть позже.";
}
function authRedirectURL(){return new URL(".",location.href).href;}
function clearAuthURL(){history.replaceState(null,"",location.pathname+"#auth");}
function recoveryMarker(id){
  try{if(id)sessionStorage.setItem("echo_recovery_user",id);else sessionStorage.removeItem("echo_recovery_user");}catch{}
}
function hasRecoveryMarker(id){try{return !!id&&sessionStorage.getItem("echo_recovery_user")===id;}catch{return false;}}
function authShell(c){const screen=appShell(c);screen.classList.add("accountScreen");return screen;}

  return authShell(c);

function authScreen(opts={}){
  const mode=opts.mode||"signin", signup=mode==="signup",forgot=mode==="forgot",reset=mode==="reset";
  const c=el("div","accountLayout");
  const title=reset?"Новый пароль.<br>Та же история.":forgot?"Вернуться<br>к себе.":signup?"Твоя история<br>начинается здесь.":"Снова здесь.<br>Снова ты.";
  const subtitle=reset?"Выбери пароль для своего ECHO.":forgot?"Отправим письмо со ссылкой для смены пароля.":signup?"Сохраняй мысли сегодня. Встречай себя спустя время.":"Войди, чтобы продолжить с того места, где остановился.";
  c.innerHTML=`
    <div class="accountTop"><button class="textButton" id="authBack" type="button">← Назад</button><div class="accountBrand">ECHO</div></div>
    <div class="accountIntro"><div class="kicker">ТВОЁ ВНУТРЕННЕЕ ПРОСТРАНСТВО</div><h1>${title}</h1><p>${subtitle}</p></div>
    <form id="authForm" class="authForm">
      ${reset?"":`<label class="authLabel" for="authEmail">Твоя почта</label><input class="authInput" id="authEmail" type="email" required autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="you@example.com">`}
      ${forgot?"":`<label class="authLabel" for="authPassword">${reset?"Новый пароль":"Пароль"}</label><div class="passwordField"><input class="authInput" id="authPassword" type="password" required minlength="6" autocomplete="${signup||reset?"new-password":"current-password"}" placeholder="${signup||reset?"Минимум 6 символов":"Твой пароль"}"><button type="button" class="passwordToggle" id="togglePassword" aria-label="Показать пароль" aria-pressed="false">Показать</button></div>`}
      ${signup||reset?`<label class="authLabel" for="authConfirm">Повтори пароль</label><input class="authInput" id="authConfirm" type="password" required minlength="6" autocomplete="new-password" placeholder="Ещё раз, чтобы не ошибиться">`:""}
      ${mode==="signin"?'<button class="textButton forgotLink" type="button" id="forgotLink">Не помню пароль</button>':""}
      <div class="authMessage" id="authError" role="alert"></div>
      <button class="cta authSubmit" type="submit" id="authSubmit">${reset?"Сохранить новый пароль":forgot?"Отправить письмо":signup?"Создать аккаунт":"Войти"}<span aria-hidden="true">→</span></button>
    </form>
    <div class="authAfter" id="authAfter">${forgot||reset?"":`${signup?"Уже есть аккаунт?":"Впервые здесь?"} <button class="textButton" id="authSwitch" type="button">${signup?"Войти":"Создать аккаунт"}</button>`}</div>
    <div class="accountFoot">${signup?"Твои ответы связаны с твоим аккаунтом.":"ТВОЯ ИСТОРИЯ ОСТАЁТСЯ С ТОБОЙ"}</div>`;
  const form=c.querySelector("#authForm"),errorBox=c.querySelector("#authError"),submit=c.querySelector("#authSubmit");
  const email=c.querySelector("#authEmail"),password=c.querySelector("#authPassword"),confirm=c.querySelector("#authConfirm");
  if(email)email.value=opts.email|| (forgot?currentUser?.email:"")||"";
  if(opts.message)errorBox.textContent=opts.message;
  c.querySelector("#authBack").onclick=()=>go(currentUser?"account":forgot?"auth":"welcome");
  c.querySelector("#authSwitch")?.addEventListener("click",()=>go("auth",{mode:signup?"signin":"signup",email:email?.value}));
  c.querySelector("#forgotLink")?.addEventListener("click",()=>go("auth",{mode:"forgot",email:email.value}));
  c.querySelector("#togglePassword")?.addEventListener("click",e=>{
    const reveal=password.type==="password";password.type=reveal?"text":"password";
    if(confirm)confirm.type=password.type;
    e.currentTarget.textContent=reveal?"Скрыть":"Показать";
    e.currentTarget.setAttribute("aria-pressed",String(reveal));
    e.currentTarget.setAttribute("aria-label",reveal?"Скрыть пароль":"Показать пароль");
  });
  form.onsubmit=async event=>{
    event.preventDefault();if(authBusy)return;
    errorBox.textContent="";
    if(confirm&&password.value!==confirm.value){errorBox.textContent="Пароли не совпадают. Введи одинаковый пароль в обоих полях.";confirm.focus();return;}
    authBusy=true;
    const owner=currentUser?.id,epoch=accountEpoch;
    const originalLabel=submit.innerHTML;
    const fields=[...c.querySelectorAll("input,button")];fields.forEach(x=>x.disabled=true);
    submit.textContent=forgot?"Отправляем…":reset?"Сохраняем…":"Открываем ECHO…";
    form.setAttribute("aria-busy","true");
    try{
      if(forgot){
        const {error}=await sb.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:authRedirectURL()});
        if(error)throw error;
        if(c.isConnected)showEmailSent(c,email.value.trim(),"recovery");
      }else if(reset){
        if(!isActiveAccount(owner,epoch))throw {code:"session_not_found"};
        const {error}=await sb.auth.updateUser({password:password.value});if(error)throw error;
        if(!isActiveAccount(owner,epoch))return;
        recoveryMode=false;recoveryMarker(null);
        go("account");showToast("Новый пароль сохранён.");
      }else{
        const credentials={email:email.value.trim(),password:password.value};
        const result=signup?await sb.auth.signUp({...credentials,options:{emailRedirectTo:authRedirectURL()}}):await sb.auth.signInWithPassword(credentials);
        if(result.error)throw result.error;
        if(!c.isConnected)return;
        // A sign-up user object alone is not an authenticated session.
        if(!result.data?.session){showEmailSent(c,credentials.email,"signup");return;}
        if(currentUser && currentUser.id!==result.data.session.user.id)return;
        await enterAccount(result.data.session);
      }
    }catch(error){if(c.isConnected)errorBox.textContent=authErrorMessage(error);}
    finally{
      authBusy=false;
      fields.forEach(x=>{if(x.isConnected)x.disabled=false;});
      if(form.isConnected){submit.innerHTML=originalLabel;form.removeAttribute("aria-busy");}
    }
  };
  return authShell(c);
}
function showEmailSent(c,email,kind){
  c.querySelector(".accountIntro h1").innerHTML="Проверь<br>свою почту.";
  c.querySelector(".accountIntro p").textContent=kind==="signup"?"Если адрес доступен для регистрации, на него придёт письмо для подтверждения. Если аккаунт уже есть — войди или восстанови пароль.":"Если для этого адреса есть аккаунт, мы отправили ссылку для смены пароля.";
  c.querySelector("#authForm").replaceWith(el("div","emailSent",`<div class="mailMark" aria-hidden="true">↗</div><div class="emailAddress">${escapeHTML(email)}</div><p>Письмо может попасть в «Спам». Открой ссылку в письме, чтобы продолжить.</p>`));
  const after=c.querySelector("#authAfter");after.innerHTML="";
  const back=el("button","cta secondary","Вернуться ко входу");back.onclick=()=>go(currentUser?"account":"auth",{email});after.append(back);
}
function accountScreen(){
  const c=el("div","accountLayout"),legacy=legacyState();
  c.innerHTML=`
    <div class="accountTop"><button class="textButton" id="accountBack">← К моей истории</button><div class="accountBrand">ECHO</div></div>
    <div class="accountIntro compact"><div class="kicker">АККАУНТ</div><h1>Твоя история.<br>Твоё пространство.</h1><p class="accountEmail">${escapeHTML(currentUser?.email||"")}</p></div>
    <div class="accountStats"><div><b data-saved-count>${state.answers.filter(a=>a.synced).length}</b><span>ОТВЕТОВ В АККАУНТЕ</span></div><div><b data-pending-count>${pendingCount()}</b><span>ЖДУТ СОХРАНЕНИЯ</span></div></div>
    <p class="syncStatus" data-sync-status role="status" aria-live="polite">${syncStatusText()}</p>
    <p class="accountNote">На другом устройстве войди с той же почтой — сохранённые ответы и послания загрузятся. Черновики остаются на этом устройстве.</p>
    <button class="cta secondary" id="syncNow">Проверить сохранение</button>
    <button class="accountRow" id="changePassword">Сменить пароль<span aria-hidden="true">↗</span></button>
    ${legacy?`<div class="legacyImport"><div class="kicker">ЗАПИСИ ПРЕЖНЕЙ ВЕРСИИ</div><p>В этом браузере есть старые записи без указанного владельца. Перенеси их, только если они твои.</p><label class="legacyConsent"><input type="checkbox" id="legacyConsent"><span>Это мои записи, я хочу добавить их в этот аккаунт.</span></label><button class="cta secondary" id="importLegacy" disabled>Перенести мои записи</button></div>`:""}
    <div class="signOutArea"><div id="logoutNotice" class="accountNote" role="status"></div><button class="accountRow" id="signOut">Выйти на этом устройстве<span aria-hidden="true">→</span></button><div id="logoutError" class="authMessage" role="alert"></div></div>
    <div class="accountFoot">ECHO · ${APP_VERSION}</div>`;
  c.querySelector("#accountBack").onclick=()=>go(accountRoute());
  c.querySelector("#syncNow").onclick=async e=>{const b=e.currentTarget;b.disabled=true;await syncAccount();if(c.isConnected)b.disabled=false;};
  c.querySelector("#changePassword").onclick=()=>go("auth",{mode:"forgot",email:currentUser?.email});
  const consent=c.querySelector("#legacyConsent"),importButton=c.querySelector("#importLegacy");
  if(consent){consent.onchange=()=>importButton.disabled=!consent.checked;importButton.onclick=()=>{if(consent.checked)importLegacy();};}
  let acceptedPending=false;
  c.querySelector("#signOut").onclick=async e=>{
    if(authBusy)return;
    const b=e.currentTarget,id=currentUser?.id,epoch=accountEpoch;
    b.disabled=true;authBusy=true;
    try{
      if(!acceptedPending)await syncAccount();
      if(!isActiveAccount(id,epoch))return;
      if(pendingCount()&&!acceptedPending){
        c.querySelector("#logoutNotice").textContent=localSaveOK?"Есть записи, которые ещё не попали в аккаунт. Копия останется здесь: войди в этот же аккаунт на этом устройстве, чтобы досохранить их.":"Браузер не смог сохранить копию. Подключись к интернету и дождись сохранения перед выходом.";
        if(localSaveOK){acceptedPending=true;b.textContent="Выйти, оставив копию здесь";}
        return;
      }
      const {error}=await sb.auth.signOut({scope:"local"});if(error)throw error;
      recoveryMode=false;recoveryMarker(null);setActiveUser(null);go("auth");
    }catch(error){if(c.isConnected)c.querySelector("#logoutError").textContent=authErrorMessage(error);}
    finally{authBusy=false;if(c.isConnected)b.disabled=false;}
  };
  return authShell(c);
}

const DOMAIN_LABELS={SELF:"Я",TIME:"ВРЕМЯ",DEATH:"СМЕРТЬ",UNKNOWN:"НЕИЗВЕСТНОЕ",CONTROL:"КОНТРОЛЬ",FREEDOM:"СВОБОДА",PEOPLE:"ЛЮДИ",LOVE:"ЛЮБОВЬ",MORALITY:"МОРАЛЬ",VALUE:"ЦЕННОСТИ",RISK:"РИСК",FUTURE:"БУДУЩЕЕ"};
function domainLabel(d){return DOMAIN_LABELS[d]||d;}
function selfModel(){
  const stats=domainStats();
  const explored=DOMAINS.filter(d=>stats[d].count>0);
  const all=state.answers;
  const avg=all.length?Math.round(all.reduce((n,a)=>n+Number(a.confidence||0),0)/all.length):0;
  const ranked=explored.slice().sort((a,b)=>stats[b].count-stats[a].count || (stats[b].avgConfidence||0)-(stats[a].avgConfidence||0));
  const strongest=ranked[0]||null;
  const uncertain=explored.slice().filter(d=>stats[d].avgConfidence!==null).sort((a,b)=>stats[a].avgConfidence-stats[b].avgConfidence)[0]||null;
  const repeated=[...new Set(all.map(a=>a.questionId))].filter(id=>answersFor(id).length>1);
  let shifts=[];
  repeated.forEach(id=>{
    const arr=answersFor(id), a=arr[arr.length-2], b=arr[arr.length-1], q=getQuestion(id);
    if(q) shifts.push({domain:q.domain,q:q.text,delta:b.confidence-a.confidence,old:a,new:b});
  });
  shifts.sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta));
  return {stats,explored,avg,ranked,strongest,uncertain,repeated,shifts};
}
function domainEvidence(d){
  const arr=state.answers.filter(a=>a.domain===d).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));

  return q?`Последняя точка: «${escapeHTML(q.text)}»`:"";
}

function constellationHTML(m){
  const pos=[[50,49],[49,13],[82,28],[88,59],[72,82],[48,88],[25,80],[11,57],[18,28],[35,36],[67,40],[35,67]];
  const center=0;

  });
  return h+"</div>";
}

  const old=state.answers.find(a=>a.id===opts.oldId);
  const fresh=state.answers.find(a=>a.id===opts.newId);
  const delta=fresh.confidence-old.confidence;
  const c=el("div");
  c.innerHTML=`<div class="kicker">ТОГДА / СЕЙЧАС</div><h1 style="font-size:34px;margin-top:18px">${q.text}</h1>
  <div class="thenNow">
    <div class="pane"><div class="date">ТОГДА · ${fmtDate(old.createdAt)}</div><div class="quote">${escapeHTML(old.text)}</div><div class="faint small" style="margin-top:12px">Уверенность ${old.confidence}%</div></div>
    <div class="pane"><div class="date">СЕЙЧАС · ${fmtDate(fresh.createdAt)}</div><div class="quote">${escapeHTML(fresh.text)}</div><div class="faint small" style="margin-top:12px">Уверенность ${fresh.confidence}%</div></div>
  </div>
  <div class="insight" style="margin-top:24px"><div class="it">ИЗМЕНЕНИЕ УВЕРЕННОСТИ</div><div class="ib">${delta===0?"Твоя уверенность не изменилась.":`Уверенность изменилась на ${delta>0?"+":""}${delta} пунктов.`}</div>
  <div class="why">ECHO не решает за тебя, означает ли это изменение позиции.</div></div>
  <div class="insight"><div class="it">ТВОЁ ОЩУЩЕНИЕ</div><div class="ib">Ты чувствуешь, что изменился?</div>
  <div style="display:flex;gap:8px;margin-top:12px"><button class="futureChoice" data-feel="YES">Да</button><button class="futureChoice" data-feel="NO">Почти нет</button><button class="futureChoice" data-feel="UNSURE">Не уверен</button></div></div>`;
  const b=el("button","cta","Сохранить в историю");b.onclick=()=>{
    state.timeline.unshift({id:`shift_${Date.now()}`,type:"SHIFT",date:new Date().toISOString(),domain:q.domain,title:`${q.domain}: revisited`,desc:q.text});
    saveState();go("timeline");
  };c.append(b);
  setTimeout(()=>c.querySelectorAll("[data-feel]").forEach(x=>x.onclick=()=>{
    c.querySelectorAll("[data-feel]").forEach(y=>y.classList.remove("active"));x.classList.add("active");
  }),0);
  return appShell(c);
}
function domain(opts){
  const d=opts.domain, stats=domainStats()[d];
  const arr=state.answers.filter(a=>a.domain===d).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const repeated=[...new Set(arr.map(a=>a.questionId))].filter(id=>answersFor(id).length>1).length;
  const avg=Number.isFinite(stats.avgConfidence)?stats.avgConfidence:"—";
  const c=el("div");
  c.innerHTML=`<button class="back">← Назад</button>
    <div class="topicHero"><div class="kicker">ОБЛАСТЬ МЫШЛЕНИЯ</div><h1>${domainLabel(d)}</h1>
    <p class="muted" style="font-size:14px;line-height:1.55;margin-top:10px">Здесь остаются твои мысли об этой части жизни — без оценки и готового ярлыка.</p></div>
    <div class="topicStat"><div><b>${stats.count}</b><span>МЫСЛЕЙ</span></div><div><b>${avg}${avg==="—"?"":"%"}</b><span>УВЕРЕННОСТЬ</span></div><div><b>${repeated}</b><span>ВОЗВРАТОВ</span></div></div>
    <div class="kicker" style="margin-top:28px">ТОЧКИ ВО ВРЕМЕНИ</div><div class="timelineLine" id="domainAnswers"></div>`;
  const list=c.querySelector("#domainAnswers");
  if(!arr.length) list.innerHTML=`<div class="muted" style="font-size:14px;line-height:1.5">Эта область пока не исследована.</div>`;
  arr.forEach(a=>{const q=getQuestion(a.questionId),item=el("div","timelinePoint");
    item.innerHTML=`<div class="faint small">${fmtDate(a.createdAt)} · ${a.confidence}%</div><div style="font-size:17px;line-height:1.48;margin-top:7px">${escapeHTML(a.text)}</div><div class="why" style="margin-top:8px">${q?escapeHTML(q.text):""}</div>`;list.append(item);});
  setTimeout(()=>c.querySelector(".back").onclick=()=>go("home"),0); return appShell(c);
}
function timeline(){
  const generated=state.answers.map(a=>({id:"a_"+a.id,type:"THOUGHT",date:a.createdAt,domain:a.domain,title:domainLabel(a.domain),desc:(getQuestion(a.questionId)||{}).text||a.text}));
  const futureItems=state.futureEchoes.map(x=>({id:"f_"+x.id,type:"FUTURE",date:x.createdAt,title:"Послание в будущее",desc:`Откроется ${fmtDate(x.unlockAt)}`}));
  const items=[...state.timeline.filter(x=>!["ANSWER","FUTURE"].includes(x.type)),...generated,...futureItems].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const c=el("div");
  c.innerHTML=`<button class="back">← Назад</button><div class="kicker">ИСТОРИЯ ECHO</div><h1 style="font-size:35px;margin-top:18px;font-weight:430">${items.length?"Твои точки во времени.":"История начнётся с первой мысли."}</h1><p class="muted" style="font-size:14px;line-height:1.5;margin-top:10px">Не лента активности. Только моменты, к которым есть смысл вернуться.</p><div class="timeline" id="tl"></div>`;
  const tl=c.querySelector("#tl");
  items.slice(0,40).forEach((item,i)=>{const row=el("div","timeItem");const title=item.type==="SHIFT"?"Изменение":item.type==="FUTURE"?"Послание в будущее":item.title;
    row.innerHTML=`<div class="markerWrap"><div class="marker" style="${item.type==="SHIFT"?"background:var(--blue)":""}"></div>${i<items.length-1?'<div class="tline"></div>':""}</div><div class="timeBody"><div class="date">${fmtDate(item.date)}</div><div class="title">${escapeHTML(title)}</div><div class="desc">${escapeHTML(item.desc||"")}</div></div>`;tl.append(row);});
  setTimeout(()=>c.querySelector(".back").onclick=()=>go("home"),0);return appShell(c);
}
function future(){
  const sealed=state.futureEchoes.filter(x=>!x.openedAt).sort((a,b)=>new Date(a.unlockAt)-new Date(b.unlockAt));
  const c=el("div");c.style.display="flex";c.style.flexDirection="column";c.style.minHeight="100%";
  c.innerHTML=`<button class="back">← Назад</button><div class="kicker">ПОСЛАНИЕ В БУДУЩЕЕ</div><div class="qscene"><div class="qtitle">Что ты хочешь сказать себе, которого ещё не существует?</div><div class="qhint">В ECHO послание будет ждать выбранной даты.</div><textarea id="futureText" placeholder="Оставь здесь то, что важно не потерять..."></textarea><div class="futureChoices"><button class="futureChoice" data-days="30">1 месяц</button><button class="futureChoice" data-days="180">6 месяцев</button><button class="futureChoice active" data-days="365">1 год</button></div>${sealed.length?`<div class="echoDivider"></div><div class="kicker">ЗАПЕЧАТАНО</div><div style="margin-top:14px">${sealed.slice(0,4).map(x=>`<div class="insight"><div class="it">ОТКРОЕТСЯ ${fmtDate(x.unlockAt)}</div><div class="ib">Послание ждёт своего времени.</div></div>`).join("")}</div>`:""}</div>`;
  const b=el("button","cta","Запечатать послание");b.onclick=()=>{const txt=c.querySelector("#futureText").value.trim(),chosen=c.querySelector(".futureChoice.active");if(!txt){showToast("Оставь сообщение.");return;}const days=Number(chosen.dataset.days),unlock=new Date(Date.now()+days*86400000);const futureRec={id:newRecordId(),synced:false,text:txt,createdAt:new Date().toISOString(),unlockAt:unlock.toISOString(),openedAt:null};state.futureEchoes.push(futureRec);state.timeline.unshift({id:`f_event_${Date.now()}`,type:"FUTURE",date:new Date().toISOString(),title:"Послание запечатано",desc:`Откроется ${fmtDate(unlock)}`});saveState();syncFutureEcho(futureRec);showToast("Послание запечатано.");go("home");};c.append(b);
  setTimeout(()=>{c.querySelector(".back").onclick=()=>go("home");c.querySelectorAll(".futureChoice").forEach(x=>x.onclick=()=>{c.querySelectorAll(".futureChoice").forEach(y=>y.classList.remove("active"));x.classList.add("active")});},0);return appShell(c);
}
function escapeHTML(str=""){return String(str??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}

function render(route,opts={}){
  activeRoute=route;
  const root=document.getElementById("app"); root.innerHTML="";
  let node;
  switch(route){
    case "loading":node=loadingScreen();break;
    case "auth":node=authScreen(opts);break;
    case "reset-password":node=authScreen({mode:"reset"});break;
    case "account":node=accountScreen();break;
    case "manifesto":node=manifesto();break;
    case "privacy":node=privacy();break;
    case "first":node=first();break;
    case "birth":node=birth();break;
    case "result":node=result();break;
    case "home":node=home();break;
    case "new-question":node=questionScreen(chooseNextQuestion());break;
    case "revisit":node=revisit();break;
    case "repeat":node=repeat(opts.id);break;
    case "compare":node=compare(opts);break;
    case "domain":node=domain(opts);break;
    case "timeline":node=timeline();break;
    case "future":node=future();break;
    default:node=welcome();
  }
  root.append(node);
}

async function enterAccount(session,preferred){
  if(!session?.user){setActiveUser(null);go("auth");return;}
  setActiveUser(session.user);
  const id=session.user.id,epoch=accountEpoch;
  recoveryMode=recoveryMode||hasRecoveryMarker(id);
  if(recoveryMode)recoveryMarker(id);
  render("loading");
  if(!await prepareAccount()||!isActiveAccount(id,epoch))return;
  go(recoveryMode?"reset-password":preferred||accountRoute());
}
async function boot(){
  render("loading");
  if(!sb){
    const c=el("div","accountLayout");
    c.innerHTML=`<div class="accountBrand">ECHO</div><div class="accountIntro"><h1>Нужен ещё<br>один момент.</h1><p>Не удалось загрузить вход. Проверь интернет и обнови страницу.</p></div>`;
    const retry=el("button","cta","Обновить страницу");retry.onclick=()=>location.reload();c.append(retry);
    document.getElementById("app").replaceChildren(authShell(c));booting=false;return;
  }
  const requested=location.hash.slice(1)||"welcome";
  try{
    const {data,error}=await sb.auth.getSession();if(error)throw error;
    if(initialAuthError){
      recoveryMode=false;recoveryMarker(null);clearAuthURL();
      setActiveUser(data?.session?.user||null);
      if(currentUser)await prepareAccount();
      go("auth",{mode:"forgot",message:"Ссылка устарела или уже использована. Запроси новое письмо."});return;
    }
    if(data?.session){
      const preferred=["welcome","auth","loading","reset-password"].includes(requested)||requested.includes("=")?null:requested;
      await enterAccount(data.session,preferred);
    }else{
      setActiveUser(null);
      if(recoveryMode||requested==="reset-password"){
        recoveryMode=false;recoveryMarker(null);go("auth",{mode:"forgot",message:"Ссылка больше не действует. Запроси новое письмо."});
      }else go(requested==="welcome"?"welcome":"auth");
    }
  }catch{
    setActiveUser(null);go("auth",{message:"Не удалось проверить вход. Проверь соединение и попробуй снова."});
  }finally{booting=false;}
}
// Keep this callback synchronous: Supabase holds its auth lock while notifying subscribers.
sb?.auth.onAuthStateChange((event,session)=>{
  const hadUser=!!currentUser;
  const changed=setActiveUser(session?.user||null);
  if(event==="PASSWORD_RECOVERY"){
    recoveryMode=true;recoveryMarker(session?.user?.id);
  }
  if(event==="SIGNED_OUT"){recoveryMode=false;recoveryMarker(null);}
  if(booting)return;
  if(changed && (!authBusy || hadUser)){
    // Remove the previous account's visible content before any asynchronous hydration.
    render(session?"loading":"auth");
  }
  if(authBusy && event!=="SIGNED_OUT")return;
  if(event==="SIGNED_OUT"){go("auth");return;}
  if(!changed && event!=="PASSWORD_RECOVERY")return;
  const id=session?.user?.id,epoch=accountEpoch;
  setTimeout(()=>{
    if(session && isActiveAccount(id,epoch))enterAccount(session);
  },0);
});
window.addEventListener("online",()=>{if(currentUser)syncAccount();});
window.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible" && currentUser && accountReady &&
     (pendingCount() || Date.now()-new Date(state.lastSyncedAt||0).getTime()>60000))syncAccount();
});
window.addEventListener("pagehide",()=>{if(currentUser)saveState();});
window.addEventListener("hashchange",()=>{
  if(!booting&&!authBusy)go(location.hash.slice(1)||"welcome");
});
boot();

</script></body></html>
