<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07080C"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ECHO"><title>ECHO</title><style>
:root{
  --bg:#07080C;--bg2:#0E1018;--surface:#12141B;--text:#F5F2E9;--muted:#AAA7B3;
  --faint:#656877;--line:#242736;--violet:#B5A4FF;--blue:#8DB8FF;--green:#9DD7B1;
}
*{box-sizing:border-box}
html,body,#app{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif}
body{min-height:100dvh;overscroll-behavior:none}
button,textarea,input{font:inherit}
button{cursor:pointer}
.screen{
  min-height:100dvh;padding:calc(env(safe-area-inset-top) + 20px) 22px calc(env(safe-area-inset-bottom) + 24px);
  display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 50% 24%,rgba(148,128,255,.12),transparent 29%),
    radial-gradient(circle at 80% 78%,rgba(75,114,255,.055),transparent 30%),
    linear-gradient(180deg,#07080C,#0D0F17 46%,#07080C);
}
.wrap{max-width:430px;width:100%;margin:0 auto;min-height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 44px);display:flex;flex-direction:column}
.logo{font-size:22px;font-weight:900;letter-spacing:7px}
.kicker{font-size:10px;font-weight:900;letter-spacing:2px;color:var(--violet)}
.faint{color:var(--faint)} .muted{color:var(--muted)}
.small{font-size:12px}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.heroOrb{width:210px;height:210px;border-radius:50%;display:grid;place-items:center;position:relative;margin-bottom:34px;background:
  radial-gradient(circle,rgba(226,221,255,.9) 0 12%,rgba(179,162,255,.18) 13% 30%,rgba(140,123,255,.06) 31% 55%,transparent 56%)}
.heroOrb:before,.heroOrb:after{content:"";position:absolute;border:1px solid rgba(179,162,255,.18);border-radius:50%}
.heroOrb:before{inset:22px;animation:pulse 4s ease-in-out infinite}
.heroOrb:after{inset:2px;animation:pulse 5.6s ease-in-out infinite reverse}
@keyframes pulse{0%,100%{transform:scale(.96);opacity:.45}50%{transform:scale(1.04);opacity:1}}
h1{font-size:37px;line-height:1.06;letter-spacing:-1.5px;margin:0;font-weight:820}
h2{font-size:29px;line-height:1.13;letter-spacing:-1px;margin:0;font-weight:790}
p{margin:0}
.hero p{font-size:18px;line-height:1.45;color:var(--muted);max-width:330px;margin-top:14px}
.cta{
  min-height:58px;width:100%;border:0;border-radius:19px;background:var(--text);color:var(--bg);
  font-size:16px;font-weight:800;padding:0 18px;display:flex;align-items:center;justify-content:center;text-decoration:none
}
.cta.secondary{background:rgba(245,242,233,.04);border:1px solid rgba(245,242,233,.13);color:var(--text)}
.cta:disabled{opacity:.38}
.copyblock{margin:auto 0;display:flex;flex-direction:column;gap:28px}
.eyebrow{font-size:11px;color:var(--violet);font-weight:900;letter-spacing:1.8px}
.bigcopy{font-size:31px;line-height:1.16;font-weight:790;letter-spacing:-1px;margin-top:7px}
.bodycopy{font-size:16px;line-height:1.55;color:var(--muted);margin-top:10px}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.qtop,.row{display:flex;align-items:center;justify-content:space-between}
.qscene{margin:auto 0;position:relative}
.qtitle{font-size:34px;line-height:1.14;letter-spacing:-1.2px;font-weight:790}
.qhint{font-size:15px;line-height:1.5;color:var(--muted);margin-top:14px}
textarea{
  width:100%;min-height:166px;border:0;border-top:1px solid rgba(255,255,255,.10);
  border-bottom:1px solid rgba(255,255,255,.07);background:transparent;color:var(--text);
  padding:20px 0;font-size:17px;line-height:1.55;resize:none;outline:none;margin-top:22px
}
textarea::placeholder{color:#595C6A}
.confidence{margin-top:18px}
.confidenceHead{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:9px}
input[type=range]{width:100%;accent-color:var(--violet)}
.birth{align-items:center;justify-content:center;text-align:center}
.birthNet{position:relative;width:290px;height:290px;margin:0 auto 34px}
.dot{position:absolute;border-radius:50%;background:#DDD6FF;box-shadow:0 0 24px rgba(190,176,255,.7)}
.ring{position:absolute;border:1px solid rgba(185,170,255,.13);border-radius:50%}
.map{position:relative;width:320px;height:330px;margin:12px auto}
.node{position:absolute;border:1px solid rgba(193,180,255,.52);border-radius:50%;background:rgba(146,127,255,.10);
  box-shadow:0 0 20px rgba(155,139,255,.25);display:grid;place-items:center;text-align:center;padding:4px}
.node b{font-size:9px;letter-spacing:.6px}
.edge{position:absolute;height:1px;background:rgba(159,148,230,.20);transform-origin:left center}
.insight{padding:18px 0;border-top:1px solid rgba(255,255,255,.09)}
.insight:last-child{border-bottom:1px solid rgba(255,255,255,.09)}
.insight .it{font-size:10px;color:var(--blue);font-weight:900;letter-spacing:1.8px}
.insight .ib{font-size:17px;line-height:1.47;color:var(--text);margin-top:8px}
.insight .why{font-size:12px;color:var(--faint);margin-top:10px}
.homeHead{display:flex;justify-content:space-between;align-items:flex-start}
.navLink{background:none;border:0;color:var(--muted);font-size:11px;font-weight:900;letter-spacing:1.5px;padding:4px}
.sectionTitle{font-size:35px;font-weight:850;letter-spacing:-1px;margin-top:32px}
.homeCard{padding:20px 0;border-top:1px solid rgba(255,255,255,.08)}
.homeCard .tag{font-size:10px;color:var(--blue);font-weight:900;letter-spacing:1.6px}
.homeCard .title{font-size:22px;line-height:1.3;font-weight:740;margin-top:10px}
.homeCard .copy{font-size:14px;line-height:1.45;color:var(--muted);margin-top:8px}
.pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:8px 11px;color:var(--muted);font-size:11px;margin:4px 5px 0 0}
.timeline{margin-top:30px}
.timeItem{display:grid;grid-template-columns:34px 1fr;gap:8px;min-height:138px}
.markerWrap{display:flex;flex-direction:column;align-items:center}
.marker{width:11px;height:11px;border-radius:50%;background:var(--violet);margin-top:12px;box-shadow:0 0 14px rgba(181,164,255,.55)}
.tline{width:1px;background:var(--line);flex:1;margin-top:5px}
.timeBody{padding:8px 0 24px}
.timeBody .date{font-size:10px;letter-spacing:1.2px;color:var(--faint)}
.timeBody .title{font-size:21px;font-weight:760;margin-top:6px}
.timeBody .desc{font-size:14px;line-height:1.45;color:var(--muted);margin-top:7px}
.thenNow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.pane{border:1px solid var(--line);border-radius:22px;padding:16px;background:rgba(255,255,255,.025)}
.pane .date{font-size:10px;letter-spacing:1.2px;color:var(--faint)}
.pane .quote{font-size:15px;line-height:1.45;margin-top:9px}
.futureChoices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.futureChoice{border:1px solid var(--line);border-radius:16px;padding:13px 8px;text-align:center;color:var(--muted);font-size:12px;background:transparent}
.futureChoice.active{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:800}
.card{border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.025);padding:17px}
.spacer{flex:1}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);
  background:#181A22;border:1px solid var(--line);padding:12px 15px;border-radius:14px;font-size:13px;
  display:none;z-index:100;max-width:90%;text-align:center}
.back{background:none;border:0;color:var(--muted);padding:0 0 20px;font-size:13px;text-align:left}
.notice{font-size:12px;line-height:1.45;color:var(--faint);margin-top:10px}

.selfHero{padding:26px 0 18px}
.selfHero h1{font-size:42px;letter-spacing:-1.7px}
.selfSummary{font-size:16px;line-height:1.55;color:var(--muted);margin-top:10px;max-width:360px}
.metricGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 28px}
.metric{border:1px solid var(--line);border-radius:20px;padding:16px;background:rgba(255,255,255,.025)}
.metric .num{font-size:27px;font-weight:820;letter-spacing:-1px}
.metric .lab{font-size:10px;color:var(--faint);letter-spacing:1.2px;margin-top:5px}
.mindRow{padding:18px 0;border-top:1px solid rgba(255,255,255,.08)}
.mindRowTop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mindName{font-size:16px;font-weight:780;letter-spacing:.4px}
.mindMeta{font-size:11px;color:var(--muted)}
.bar{height:3px;background:#1b1e28;border-radius:999px;margin-top:11px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--blue));border-radius:999px}
.evidence{font-size:13px;line-height:1.5;color:var(--muted);margin-top:9px}
.shiftCard{border:1px solid rgba(141,184,255,.2);border-radius:20px;padding:17px;margin-top:10px;background:rgba(141,184,255,.035)}

.constellation{position:relative;height:330px;margin:18px 0 28px;border:1px solid var(--line);border-radius:28px;overflow:hidden;background:radial-gradient(circle at 50% 45%,rgba(119,91,255,.12),transparent 42%)}
.constellation svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mindNode{position:absolute;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:#0b0d13;color:var(--text);font-size:9px;font-weight:800;letter-spacing:.6px;box-shadow:0 0 24px rgba(120,120,255,.08)}
.mindNode.active{border-color:rgba(163,151,255,.65);box-shadow:0 0 28px rgba(125,105,255,.24)}
.mindNode small{display:block;font-size:8px;color:var(--muted);margin-top:2px}
.insightBtn{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.025);color:var(--text);padding:17px;margin-top:10px}
.insightBtn .head{font-size:10px;letter-spacing:1.2px;color:var(--blue);font-weight:800}
.insightBtn .body{font-size:16px;line-height:1.45;font-weight:720;margin-top:7px}
.insightBtn .tap{font-size:11px;color:var(--faint);margin-top:9px}
.evidenceSheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.72);display:flex;align-items:flex-end}
.evidencePanel{width:100%;max-height:82vh;overflow:auto;background:#0d0f15;border-top:1px solid var(--line);border-radius:28px 28px 0 0;padding:24px 20px 36px}
.quoteCard{border-left:2px solid rgba(163,151,255,.55);padding:4px 0 4px 14px;margin:18px 0}
.quoteText{font-size:15px;line-height:1.55}

/* ECHO 0.7 — visual system reset */
:root{--bg:#08090d;--surface:#0e1017;--card:#11131b;--text:#f4f4f7;--muted:#999ca8;--faint:#646773;--line:rgba(255,255,255,.09);--violet:#8b82ff;--blue:#a7b8ff}
body{background:
radial-gradient(circle at 78% -5%,rgba(112,105,190,.09),transparent 30%),
linear-gradient(180deg,#07080b 0%,#0a0b10 100%);color:var(--text)}
.app{max-width:430px}
.homeHead{padding-top:8px}
.logo{font-weight:500!important;letter-spacing:7px!important}
.selfHero{padding:38px 0 14px}
.selfHero h1{font-size:34px!important;font-weight:420;line-height:1.08;letter-spacing:-1.2px}
.selfSummary{font-size:14px!important;max-width:330px;color:#8d909b!important}
.metricGrid{display:none!important}
.kicker{font-size:9px!important;letter-spacing:3px!important;font-weight:650!important;color:#9d99c9!important}
.insightBtn{background:transparent!important;border:0!important;border-top:1px solid var(--line)!important;border-radius:0!important;padding:18px 0!important}
.insightBtn .head{font-size:9px!important;letter-spacing:2.2px!important;color:#777a87!important}
.insightBtn .body{font-size:15px!important;font-weight:450!important;line-height:1.55!important}
.insightBtn .tap{font-size:10px!important}
.constellation{height:390px!important;border:0!important;border-radius:0!important;margin:8px -8px 12px!important;background:
radial-gradient(circle at 50% 50%,rgba(102,91,205,.10),transparent 34%),
radial-gradient(circle at 50% 50%,rgba(255,255,255,.025),transparent 55%)!important}
.constellation:before{content:"";position:absolute;inset:25px;border:1px solid rgba(255,255,255,.025);border-radius:50%}
.mindNode{width:auto!important;height:auto!important;min-width:0!important;border:0!important;background:transparent!important;box-shadow:none!important;border-radius:0!important;padding:8px!important;font-size:8px!important;letter-spacing:1.25px!important;color:#555965!important}
.mindNode.active{color:#d7d7df!important;text-shadow:0 0 14px rgba(188,181,255,.55)!important}
.mindNode.active:before{content:"";display:block;width:5px;height:5px;border-radius:50%;background:#ececff;margin:0 auto 7px;box-shadow:0 0 12px #aaa3ff,0 0 25px rgba(130,120,255,.8)}
.mindNode small{display:none!important}
.mindRowsSummary{display:flex;justify-content:center;color:#777b88;font-size:11px;letter-spacing:.6px;margin:2px 0 26px}
#mindRows{display:none}
.homeCard{background:transparent!important;border:0!important;border-top:1px solid var(--line)!important;border-radius:0!important;padding:22px 0!important;margin-top:0!important}
.homeCard .title{font-size:18px!important;font-weight:480!important}
.homeCard .copy{font-size:12px!important}
.cta.secondary{border-color:rgba(255,255,255,.12)!important;background:#11131a!important}
.shiftCard{background:transparent!important;border:0!important;border-left:1px solid rgba(154,145,255,.35)!important;border-radius:0!important;padding:5px 0 5px 17px!important;margin:18px 0!important}
.evidencePanel{background:#0b0d12!important}

/* ECHO 0.8 — unified visual language */
.screen{animation:echoIn .42s ease both}
@keyframes echoIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.questionCard,.compareCard,.domainCard,.timelineCard,.futureCard{background:transparent!important;border:0!important;border-radius:0!important}
textarea,input{background:#0d0f15!important;border:1px solid rgba(255,255,255,.09)!important;border-radius:18px!important;color:var(--text)!important}
textarea:focus,input:focus{border-color:rgba(156,147,255,.38)!important;box-shadow:0 0 0 3px rgba(132,120,255,.06)!important}
.questionText{font-weight:430!important;letter-spacing:-.6px!important;line-height:1.18!important}
.progressTrack{height:2px!important;background:rgba(255,255,255,.06)!important}
.progressFill{background:linear-gradient(90deg,#8078e8,#b0aaff)!important}
.cta{border-radius:18px!important;min-height:52px!important;font-weight:620!important}
.backBtn,.navLink{letter-spacing:1px!important}
.rangeWrap{background:transparent!important;border-top:1px solid var(--line)!important;border-bottom:1px solid var(--line)!important;border-radius:0!important;padding:18px 0!important}
input[type=range]{background:transparent!important;border:0!important}
.echoDivider{height:1px;background:linear-gradient(90deg,transparent,rgba(150,141,255,.3),transparent);margin:28px 0}
.thenNow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}
.timeSide{min-width:0;border:1px solid var(--line);border-radius:20px;padding:16px;background:rgba(255,255,255,.018)}
.timeSide .when{font-size:9px;letter-spacing:2px;color:#8f8aaf}
.timeSide .answer{font-size:13px;line-height:1.5;margin-top:10px;word-break:break-word}
.timelineLine{position:relative;padding-left:24px;margin-top:20px}
.timelineLine:before{content:"";position:absolute;left:5px;top:5px;bottom:5px;width:1px;background:linear-gradient(#8179e7,rgba(255,255,255,.06))}
.timelinePoint{position:relative;padding:0 0 26px 0}
.timelinePoint:before{content:"";position:absolute;left:-22px;top:5px;width:7px;height:7px;border-radius:50%;background:#aaa4ff;box-shadow:0 0 14px rgba(151,142,255,.7)}
.topicHero{padding:30px 0 16px}
.topicHero h1{font-size:38px;font-weight:430;letter-spacing:-1.3px}
.topicStat{display:flex;gap:24px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:18px 0}
.topicStat b{display:block;font-size:22px;font-weight:500}.topicStat span{font-size:9px;color:var(--faint);letter-spacing:1.5px}

/* ECHO 0.10 — cinematic landing */
.landingScreen{padding:0!important;background:#05070b!important;overflow:hidden!important}
.landingScreen .wrap{max-width:430px;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 24px) 22px calc(env(safe-area-inset-bottom) + 24px);position:relative;z-index:2}
.echoSpace{position:absolute;inset:0;overflow:hidden;pointer-events:none;background:
radial-gradient(circle at 16% 12%,rgba(111,137,178,.13) 0 1px,transparent 1.6px),
radial-gradient(circle at 76% 17%,rgba(255,255,255,.32) 0 1px,transparent 1.4px),
radial-gradient(circle at 61% 8%,rgba(153,174,211,.22) 0 1px,transparent 1.4px),
radial-gradient(circle at 88% 29%,rgba(255,255,255,.18) 0 1px,transparent 1.5px),
radial-gradient(circle at 31% 25%,rgba(255,255,255,.18) 0 1px,transparent 1.5px),
linear-gradient(180deg,#030508 0%,#070a10 48%,#030508 100%)}
.echoSpace:before{content:"";position:absolute;width:640px;height:640px;border-radius:50%;left:-290px;top:235px;background:
radial-gradient(circle at 73% 28%,rgba(247,244,232,.95) 0 1%,rgba(180,191,215,.36) 2%,transparent 6%),
radial-gradient(circle at 62% 37%,rgba(59,76,98,.72),transparent 29%),
radial-gradient(circle at 45% 55%,#0c121a 0 45%,#05080d 67%,#020305 100%);
box-shadow:0 0 0 1px rgba(205,219,239,.28),28px -22px 80px rgba(180,201,230,.16),110px -80px 120px rgba(218,210,188,.08);transform:rotate(-14deg)}
.echoSpace:after{content:"";position:absolute;width:520px;height:190px;border:1px solid rgba(203,211,229,.20);border-color:rgba(203,211,229,.22) transparent transparent transparent;border-radius:50%;left:-50px;top:305px;transform:rotate(25deg)}
.landingTop{position:relative;z-index:3}
.landingMicro{font-size:9px;letter-spacing:3.6px;color:#6f7480;margin-bottom:18px}
.landingBrand{font-size:29px;font-weight:430;letter-spacing:10px;color:#f6f6f8;text-shadow:0 0 22px rgba(255,255,255,.15)}
.landingSub{font-size:10px;letter-spacing:3.3px;color:#777c89;margin-top:9px}
.landingMoon{position:absolute;right:22px;top:118px;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 28% 38%,#777b86 0 1%,#1a1e26 12%,#080b10 55%,#020305 78%);box-shadow:-5px 0 14px rgba(225,214,191,.25),0 0 0 1px rgba(255,255,255,.07)}
.landingTime{position:absolute;right:23px;top:205px;text-align:center;color:#707580;font-size:8px;letter-spacing:2.6px;line-height:2.3}
.landingCopy{position:relative;z-index:3;margin-top:390px}
.landingCopy h1{font-family:Georgia,"Times New Roman",serif;font-size:43px;line-height:.98;font-weight:400;letter-spacing:-2px;max-width:335px}
.landingCopy h1 span{color:#737985}
.landingCopy p{font-size:14px;line-height:1.55;color:#9b9ea7;max-width:330px;margin-top:18px}
.landingFeatures{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:24px}
.landingFeature{text-align:center}
.landingIcon{height:48px;border:1px solid rgba(255,255,255,.12);border-radius:15px;display:grid;place-items:center;background:rgba(7,9,14,.48);backdrop-filter:blur(10px);font-size:17px;color:#e6e7eb}
.landingFeature span{display:block;font-size:7px;line-height:1.35;letter-spacing:1.2px;color:#a1a4ad;margin-top:8px}
.landingActions{margin-top:24px;position:relative;z-index:3}
.landingPrimary{height:58px;border-radius:18px;background:#f3f3f5;color:#07080b;border:0;width:100%;font-size:16px;font-weight:650;position:relative}
.landingPrimary:after{content:"→";position:absolute;right:21px;font-size:24px;font-weight:400;top:13px}
.landingSecondary{height:54px;border-radius:18px;background:rgba(8,10,15,.55);color:#c4c6cc;border:1px solid rgba(255,255,255,.13);width:100%;font-size:14px;margin-top:10px;backdrop-filter:blur(10px)}
.landingFoot{text-align:center;color:#4e525d;font-size:8px;letter-spacing:3px;margin-top:20px}
@media(max-height:760px){.landingCopy{margin-top:320px}.landingFeatures{margin-top:18px}.landingActions{margin-top:18px}.landingCopy h1{font-size:38px}.echoSpace:before{top:195px}}

@media(min-width:700px){.screen{max-width:430px;margin:0 auto;border-left:1px solid #151721;border-right:1px solid #151721}}

/* ECHO 0.10.1 — welcome polish */
.landingScreen .wrap{padding:calc(env(safe-area-inset-top) + 18px) 24px calc(env(safe-area-inset-bottom) + 18px)!important}
.echoSpace{background:

function loadState(){

  localStorage.setItem("echo_alpha_state", JSON.stringify(state));

async function syncAnswer(rec){
  if(!currentUser) return;
  const q=getQuestion(rec.questionId);
  const {error}=await sb.from("thought_snapshots").insert({
    user_id:currentUser.id, question_id:rec.questionId, question_text:q.text,
    domain:rec.domain, raw_answer:rec.text, confidence:rec.confidence
  });
  if(error){ console.error("ECHO sync:",error); showToast("Cloud error: "+error.message); }
  else { showToast("Сохранено в ECHO Cloud"); }
}
async function syncFutureEcho(rec){
  if(!currentUser) return;
  const {error}=await sb.from("future_echoes").insert({
    user_id:currentUser.id, message:rec.text, unlock_at:rec.unlockAt
  });
  if(error){ console.error("ECHO future sync:",error); showToast("Cloud error: "+error.message); }
  else { showToast("Future Echo сохранён в ECHO Cloud"); }
}

async function hydrateFromCloud(){
  if(!currentUser) return;
  const {data,error}=await sb.from("thought_snapshots")
    .select("id,created_at,question_id,domain,raw_answer,confidence")
    .eq("user_id",currentUser.id).order("created_at",{ascending:true});
  if(error){showToast("Cloud load error: "+error.message);return;}
  const cloud=(data||[]).map(x=>({
    id:x.id, questionId:x.question_id, domain:x.domain, text:x.raw_answer,
    confidence:Number(x.confidence??70), createdAt:x.created_at, source:"cloud"
  }));
  const byFingerprint=new Map();
  [...cloud,...state.answers].forEach(a=>{
    const k=[a.questionId,a.text,a.confidence].join("|");
    if(!byFingerprint.has(k) || a.source==="cloud") byFingerprint.set(k,a);
  });
  state.answers=[...byFingerprint.values()].sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
  if(state.answers.length){
    state.onboardingDone=true;
    if(FIRST_ECHO_IDS.every(id=>state.answers.some(a=>a.questionId===id))) state.firstEchoDone=true;
  }
  saveState();
}
async function migrateLocalToCloud(){
  if(!currentUser || localStorage.getItem("echo_cloud_migrated_"+currentUser.id)==="1") return;
  const {data,error}=await sb.from("thought_snapshots")
    .select("question_id,raw_answer,confidence").eq("user_id",currentUser.id);
  if(error){showToast("Migration check error: "+error.message);return;}
  const existing=new Set((data||[]).map(x=>[x.question_id,x.raw_answer,Number(x.confidence??70)].join("|")));
  const local=[...state.answers];
  for(const rec of local){
    const key=[rec.questionId,rec.text,Number(rec.confidence??70)].join("|");
    if(existing.has(key)) continue;
    const q=getQuestion(rec.questionId);
    if(!q) continue;
    const {error:insertError}=await sb.from("thought_snapshots").insert({
      user_id:currentUser.id, question_id:rec.questionId, question_text:q.text,
      domain:rec.domain, raw_answer:rec.text, confidence:Number(rec.confidence??70),
      created_at:rec.createdAt
    });
    if(insertError){showToast("Migration error: "+insertError.message);return;}
    existing.add(key);
  }
  localStorage.setItem("echo_cloud_migrated_"+currentUser.id,"1");
}

function answersFor(id){ return state.answers.filter(a=>a.questionId===id).sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt)); }
function latestAnswer(id){ const a=answersFor(id); return a[a.length-1] || null; }

function saveAnswer(questionId, text, confidence=70, source="normal"){
  const q=getQuestion(questionId);
  const rec={
    id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}_${Math.random()}`,
    questionId, domain:q.domain, text:text.trim(), confidence:Number(confidence),
    createdAt:new Date().toISOString(), source
  };
  state.answers.push(rec);
  state.timeline.push({
    id:`ans_${rec.id}`,type:"ANSWER",date:rec.createdAt,domain:q.domain,
    title:source==="repeat"?"Echo revisited":"Thought saved",
    desc:q.text
  });
  saveState();
  syncAnswer(rec);
  return rec;
}

function domainStats(){
  const out={};
  DOMAINS.forEach(d=>out[d]={count:0,avgConfidence:null,last:null});
  state.answers.forEach(a=>{
    out[a.domain].count++;
    out[a.domain].last=a.createdAt;
  });
  DOMAINS.forEach(d=>{
    const arr=state.answers.filter(a=>a.domain===d);
    if(arr.length) out[d].avgConfidence=Math.round(arr.reduce((s,a)=>s+a.confidence,0)/arr.length);
  });
  return out;
}

const DOMAIN_LABELS={SELF:"Я",TIME:"ВРЕМЯ",DEATH:"СМЕРТЬ",UNKNOWN:"НЕИЗВЕСТНОЕ",CONTROL:"КОНТРОЛЬ",FREEDOM:"СВОБОДА",PEOPLE:"ЛЮДИ",LOVE:"ЛЮБОВЬ",MORALITY:"МОРАЛЬ",VALUE:"ЦЕННОСТИ",RISK:"РИСК",FUTURE:"БУДУЩЕЕ"};

function selfModel(){
  const stats=domainStats();
  const explored=DOMAINS.filter(d=>stats[d].count>0);
  const all=state.answers;
  const avg=all.length?Math.round(all.reduce((n,a)=>n+Number(a.confidence||0),0)/all.length):0;
  const ranked=explored.slice().sort((a,b)=>stats[b].count-stats[a].count || (stats[b].avgConfidence||0)-(stats[a].avgConfidence||0));
  const strongest=ranked[0]||null;
  const uncertain=explored.slice().filter(d=>stats[d].avgConfidence!==null).sort((a,b)=>stats[a].avgConfidence-stats[b].avgConfidence)[0]||null;
  const repeated=[...new Set(all.map(a=>a.questionId))].filter(id=>answersFor(id).length>1);
  let shifts=[];
  repeated.forEach(id=>{
    const arr=answersFor(id), a=arr[arr.length-2], b=arr[arr.length-1], q=getQuestion(id);
    if(q) shifts.push({domain:q.domain,q:q.text,delta:b.confidence-a.confidence,old:a,new:b});
  });
  shifts.sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta));
  return {stats,explored,avg,ranked,strongest,uncertain,repeated,shifts};
}

function timeline(){
  const generated=state.answers.map(a=>({id:"a_"+a.id,type:"THOUGHT",date:a.createdAt,domain:a.domain,title:domainLabel(a.domain),desc:(getQuestion(a.questionId)||{}).text||a.text}));
  const items=[...state.timeline,...generated].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const c=el("div");
  c.innerHTML=`<button class="back">← Назад</button><div class="kicker">ИСТОРИЯ ECHO</div><h1 style="font-size:35px;margin-top:18px;font-weight:430">${items.length?"Твои точки во времени.":"История начнётся с первой мысли."}</h1><p class="muted" style="font-size:14px;line-height:1.5;margin-top:10px">Не лента активности. Только моменты, к которым есть смысл вернуться.</p><div class="timeline" id="tl"></div>`;
  const tl=c.querySelector("#tl");
  items.slice(0,40).forEach((item,i)=>{const row=el("div","timeItem");const title=item.type==="SHIFT"?"Изменение":item.type==="FUTURE"?"Послание в будущее":item.title;
    row.innerHTML=`<div class="markerWrap"><div class="marker" style="${item.type==="SHIFT"?"background:var(--blue)":""}"></div>${i<items.length-1?'<div class="tline"></div>':""}</div><div class="timeBody"><div class="date">${fmtDate(item.date)}</div><div class="title">${escapeHTML(title)}</div><div class="desc">${escapeHTML(item.desc||"")}</div></div>`;tl.append(row);});
  setTimeout(()=>document.querySelector(".back").onclick=()=>go("home"),0);return appShell(c);
}
function future(){
  const sealed=state.futureEchoes.filter(x=>!x.openedAt).sort((a,b)=>new Date(a.unlockAt)-new Date(b.unlockAt));
  const c=el("div");c.style.display="flex";c.style.flexDirection="column";c.style.minHeight="100%";
  c.innerHTML=`<button class="back">← Назад</button><div class="kicker">ПОСЛАНИЕ В БУДУЩЕЕ</div><div class="qscene"><div class="qtitle">Что ты хочешь сказать себе, которого ещё не существует?</div><div class="qhint">Мысль будет закрыта до выбранной даты. Раньше открыть её нельзя.</div><textarea id="futureText" placeholder="Оставь здесь то, что важно не потерять..."></textarea><div class="futureChoices"><button class="futureChoice" data-days="30">1 месяц</button><button class="futureChoice" data-days="180">6 месяцев</button><button class="futureChoice active" data-days="365">1 год</button></div>${sealed.length?`<div class="echoDivider"></div><div class="kicker">ЗАПЕЧАТАНО</div><div style="margin-top:14px">${sealed.slice(0,4).map(x=>`<div class="insight"><div class="it">ОТКРОЕТСЯ ${fmtDate(x.unlockAt)}</div><div class="ib">Послание ждёт своего времени.</div></div>`).join("")}</div>`:""}</div>`;
  const b=el("button","cta","Запечатать послание");b.onclick=()=>{const txt=document.getElementById("futureText").value.trim(),chosen=document.querySelector(".futureChoice.active");if(!txt){showToast("Оставь сообщение.");return;}const days=Number(chosen.dataset.days),unlock=new Date(Date.now()+days*86400000);const futureRec={id:`f_${Date.now()}`,text:txt,createdAt:new Date().toISOString(),unlockAt:unlock.toISOString(),openedAt:null};state.futureEchoes.push(futureRec);syncFutureEcho(futureRec);state.timeline.unshift({id:`f_event_${Date.now()}`,type:"FUTURE",date:new Date().toISOString(),title:"Послание запечатано",desc:`Откроется ${fmtDate(unlock)}`});saveState();showToast("Послание запечатано.");setTimeout(()=>go("home"),500);};c.append(b);
  setTimeout(()=>{document.querySelector(".back").onclick=()=>go("home");document.querySelectorAll(".futureChoice").forEach(x=>x.onclick=()=>{document.querySelectorAll(".futureChoice").forEach(y=>y.classList.remove("active"));x.classList.add("active")});},0);return appShell(c);
}
function escapeHTML(str=""){return str.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}

function render(route,opts={}){
  const root=document.getElementById("app"); root.innerHTML="";
  let node;
  switch(route){
    case "auth":node=authScreen();break;
    case "manifesto":node=manifesto();break;
    case "privacy":node=privacy();break;
    case "first":node=first();break;
    case "birth":node=birth();break;
    case "result":node=result();break;
    case "home":node=home();break;
    case "new-question":node=questionScreen(chooseNextQuestion());break;
    case "revisit":node=revisit();break;
    case "repeat":node=repeat(opts.id);break;
    case "compare":node=compare(opts);break;
    case "domain":node=domain(opts);break;
    case "timeline":node=timeline();break;
    case "future":node=future();break;
    default:node=welcome();
  }
  root.append(node);
}

async function boot(){
  const {data}=await sb.auth.getSession();
  currentUser=data.session?.user||null;
  const hash=location.hash.replace("#","")||"welcome";
  if(hash!=="welcome" && hash!=="auth" && !currentUser){render("auth");return;}
  if(currentUser) await prepareAccount();
  render(hash);
}
sb.auth.onAuthStateChange((_event,session)=>{currentUser=session?.user||null;});
boot();
</script></body></html>
