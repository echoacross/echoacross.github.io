</style></head><body><div id="app"></div><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const APP_VERSION = "0.4.0";
const SUPABASE_URL = "https://aqrxvzobcswuurswzcvq.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxcnh2em9iY3N3dXVyc3d6Y3ZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMzQzMzcsImV4cCI6MjEwNTYxMDMzN30.ZizSy1RUgu5zL6FjB5eEP4Dd6rMAYCaoi3jmLvHfkgs";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null;
const FIRST_ECHO_IDS = ["self_001","death_001","unknown_001","identity_001","belief_001","continuity_001","control_001","core_001"];
const DOMAINS = ["SELF","TIME","DEATH","UNKNOWN","CONTROL","FREEDOM","PEOPLE","LOVE","MORALITY","VALUE","RISK","FUTURE"];

let questions = [{"id": "self_001", "domain": "SELF", "text": "Если убрать всё, что другие знают о тебе — что останется?", "hint": "Не роль. Не имя. Не образ. Что останется внутри?", "returnDays": 365}, {"id": "death_001", "domain": "DEATH", "text": "Что страшнее: исчезнуть полностью или прожить жизнь, которая была не твоей?", "hint": "Выбери не красивый ответ. Выбери свой.", "returnDays": 365}, {"id": "unknown_001", "domain": "UNKNOWN", "text": "Если бы можно было узнать одну абсолютную правду о реальности — что бы ты спросил?", "hint": "Один вопрос. Один настоящий ответ.", "returnDays": 540}, {"id": "identity_001", "domain": "SELF", "text": "Что делает человека тем же самым человеком спустя годы?", "hint": "Память? Сознание? Тело? История? Что-то другое?", "returnDays": 365}, {"id": "belief_001", "domain": "UNKNOWN", "text": "Во что ты допускаешь возможность верить, хотя не можешь это доказать?", "hint": "Не обязательно то, что ты готов защищать.", "returnDays": 365}, {"id": "continuity_001", "domain": "SELF", "text": "Если все твои воспоминания заменить другими, но сознание продолжится — это всё ещё ты?", "hint": "Да / нет / не уверен — и почему.", "returnDays": 540}, {"id": "control_001", "domain": "CONTROL", "text": "Насколько твоя жизнь действительно принадлежит тебе?", "hint": "Не насколько ты хочешь так думать. Насколько ты это чувствуешь.", "returnDays": 120}, {"id": "core_001", "domain": "SELF", "text": "Что в себе ты больше всего не хотел бы однажды потерять?", "hint": "Это станет одной из первых точек твоего ECHO.", "returnDays": 365}, {"id": "value_001", "domain": "VALUE", "text": "Что сегодня делает твою жизнь стоящей?", "hint": "Не общий ответ. Именно сегодня.", "returnDays": 180}, {"id": "future_001", "domain": "FUTURE", "text": "Если твоя жизнь продолжится в том же направлении ещё пять лет, ты будешь доволен?", "hint": "Что в ответе хочется изменить уже сейчас?", "returnDays": 180}, {"id": "people_001", "domain": "PEOPLE", "text": "Тебе важнее быть понятым или принятым?", "hint": "И почему именно это?", "returnDays": 240}, {"id": "freedom_001", "domain": "FREEDOM", "text": "Что сегодня означает для тебя свобода?", "hint": "Деньги, время, независимость, выбор — или что-то другое?", "returnDays": 180}];
let state = loadState();

function defaultState(){
  return {
    version: APP_VERSION,
    createdAt: null,
    onboardingDone: false,
    firstEchoDone: false,
    answers: [],
    futureEchoes: [],
    timeline: [],
    currentFirstIndex: 0
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem("echo_alpha_state");
    if(!raw) return defaultState();
    return {...defaultState(), ...JSON.parse(raw)};
  }catch(e){ return defaultState(); }
}
function saveState(){
  localStorage.setItem("echo_alpha_state", JSON.stringify(state));
}
async function syncAnswer(rec){
  if(!currentUser) return;
  const q=getQuestion(rec.questionId);
  const {error}=await sb.from("thought_snapshots").insert({
    user_id:currentUser.id, question_id:rec.questionId, question_text:q.text,
    domain:rec.domain, raw_answer:rec.text, confidence:rec.confidence
  });
  if(error){ console.error("ECHO sync:",error); showToast("Cloud error: "+error.message); }
  else { showToast("Сохранено в ECHO Cloud"); }
}
async function syncFutureEcho(rec){
  if(!currentUser) return;
  const {error}=await sb.from("future_echoes").insert({
    user_id:currentUser.id, message:rec.text, unlock_at:rec.unlockAt
  });
  if(error){ console.error("ECHO future sync:",error); showToast("Cloud error: "+error.message); }
  else { showToast("Future Echo сохранён в ECHO Cloud"); }
}

async function hydrateFromCloud(){
  if(!currentUser) return;
  const {data,error}=await sb.from("thought_snapshots")
    .select("id,created_at,question_id,domain,raw_answer,confidence")
    .eq("user_id",currentUser.id).order("created_at",{ascending:true});
  if(error){showToast("Cloud load error: "+error.message);return;}
  const cloud=(data||[]).map(x=>({
    id:x.id, questionId:x.question_id, domain:x.domain, text:x.raw_answer,
    confidence:Number(x.confidence??70), createdAt:x.created_at, source:"cloud"
  }));
  const byFingerprint=new Map();
  [...cloud,...state.answers].forEach(a=>{
    const k=[a.questionId,a.text,a.confidence].join("|");
    if(!byFingerprint.has(k) || a.source==="cloud") byFingerprint.set(k,a);
  });
  state.answers=[...byFingerprint.values()].sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
  if(state.answers.length){
    state.onboardingDone=true;
    if(FIRST_ECHO_IDS.every(id=>state.answers.some(a=>a.questionId===id))) state.firstEchoDone=true;
  }
  saveState();
}
async function migrateLocalToCloud(){
  if(!currentUser || localStorage.getItem("echo_cloud_migrated_"+currentUser.id)==="1") return;
  const {data,error}=await sb.from("thought_snapshots")
    .select("question_id,raw_answer,confidence").eq("user_id",currentUser.id);
  if(error){showToast("Migration check error: "+error.message);return;}
  const existing=new Set((data||[]).map(x=>[x.question_id,x.raw_answer,Number(x.confidence??70)].join("|")));
  const local=[...state.answers];
  for(const rec of local){
    const key=[rec.questionId,rec.text,Number(rec.confidence??70)].join("|");
    if(existing.has(key)) continue;
    const q=getQuestion(rec.questionId);
    if(!q) continue;
    const {error:insertError}=await sb.from("thought_snapshots").insert({
      user_id:currentUser.id, question_id:rec.questionId, question_text:q.text,
      domain:rec.domain, raw_answer:rec.text, confidence:Number(rec.confidence??70),
      created_at:rec.createdAt
    });
    if(insertError){showToast("Migration error: "+insertError.message);return;}
    existing.add(key);
  }
  localStorage.setItem("echo_cloud_migrated_"+currentUser.id,"1");
}
async function prepareAccount(){
  await migrateLocalToCloud();
  await hydrateFromCloud();
}
function el(tag, cls="", html=""){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html) e.innerHTML = html;
  return e;
}
function fmtDate(d){
  const date = new Date(d);
  return date.toLocaleDateString("ru-RU",{day:"2-digit",month:"short",year:"numeric"}).toUpperCase();
}
function daysBetween(a,b){
  return Math.floor((new Date(b)-new Date(a))/86400000);
}
function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.style.display="block";
  setTimeout(()=>t.style.display="none",1500);
}
function go(route, opts={}){
  render(route, opts);
  window.scrollTo({top:0,behavior:"instant"});
  history.replaceState({route},"",`#${route}`);
}
function getQuestion(id){ return questions.find(q=>q.id===id); }
function answersFor(id){ return state.answers.filter(a=>a.questionId===id).sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt)); }
function latestAnswer(id){ const a=answersFor(id); return a[a.length-1] || null; }

function saveAnswer(questionId, text, confidence=70, source="normal"){
  const q=getQuestion(questionId);
  const rec={
    id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}_${Math.random()}`,
    questionId, domain:q.domain, text:text.trim(), confidence:Number(confidence),
    createdAt:new Date().toISOString(), source
  };
  state.answers.push(rec);
  state.timeline.push({
    id:`ans_${rec.id}`,type:"ANSWER",date:rec.createdAt,domain:q.domain,
    title:source==="repeat"?"Echo revisited":"Thought saved",
    desc:q.text
  });
  saveState();
  syncAnswer(rec);
  return rec;
}

function domainStats(){
  const out={};
  DOMAINS.forEach(d=>out[d]={count:0,avgConfidence:null,last:null});
  state.answers.forEach(a=>{
    out[a.domain].count++;
    out[a.domain].last=a.createdAt;
  });
  DOMAINS.forEach(d=>{
    const arr=state.answers.filter(a=>a.domain===d);
    if(arr.length) out[d].avgConfidence=Math.round(arr.reduce((s,a)=>s+a.confidence,0)/arr.length);
  });
  return out;
}

}

      <div><input id="authEmail" type="email" placeholder="Email" style="width:100%;height:56px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.03);color:var(--text);padding:0 16px;outline:none">

    </div>`;
  const signUp=el("button","cta","Создать аккаунт");
  const signIn=el("button","cta secondary","У меня уже есть аккаунт");
  signIn.style.marginTop="10px";
  function credentials(){

    const password=document.getElementById("authPassword").value;
    if(!email || password.length<6){document.getElementById("authError").textContent="Введи email и пароль минимум из 6 символов.";return null;}
    return {email,password};
  }
  signUp.onclick=async()=>{const x=credentials();if(!x)return;signUp.disabled=true;
    const {data,error}=await sb.auth.signUp(x);signUp.disabled=false;
    if(error){document.getElementById("authError").textContent=error.message;return;}
    currentUser=data.user; await prepareAccount(); go(state.onboardingDone?(state.firstEchoDone?"home":"first"):"manifesto");
  };
  signIn.onclick=async()=>{const x=credentials();if(!x)return;signIn.disabled=true;

    if(error){document.getElementById("authError").textContent="Не удалось войти. Проверь email и пароль.";return;}

function selfModel(){
  const stats=domainStats();
  const explored=DOMAINS.filter(d=>stats[d].count>0);
  const all=state.answers;
  const avg=all.length?Math.round(all.reduce((n,a)=>n+Number(a.confidence||0),0)/all.length):0;
  const ranked=explored.slice().sort((a,b)=>stats[b].count-stats[a].count || (stats[b].avgConfidence||0)-(stats[a].avgConfidence||0));
  const strongest=ranked[0]||null;
  const uncertain=explored.slice().filter(d=>stats[d].avgConfidence!==null).sort((a,b)=>stats[a].avgConfidence-stats[b].avgConfidence)[0]||null;
  const repeated=[...new Set(all.map(a=>a.questionId))].filter(id=>answersFor(id).length>1);
  let shifts=[];
  repeated.forEach(id=>{
    const arr=answersFor(id), a=arr[arr.length-2], b=arr[arr.length-1], q=getQuestion(id);
    if(q) shifts.push({domain:q.domain,q:q.text,delta:b.confidence-a.confidence,old:a,new:b});
  });
  shifts.sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta));
  return {stats,explored,avg,ranked,strongest,uncertain,repeated,shifts};
}
function domainEvidence(d){
  const arr=state.answers.filter(a=>a.domain===d).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));

  return q?`Последняя точка: «${escapeHTML(q.text)}»`:"";
}

  const list=c.querySelector("#domainAnswers");
  if(!arr.length) list.innerHTML=`<div class="card muted">Эта область пока почти не исследована.</div>`;
  arr.forEach(a=>{
    const q=getQuestion(a.questionId);
    const item=el("div","insight");
    item.innerHTML=`<div class="it">${fmtDate(a.createdAt)}</div><div class="ib">${escapeHTML(a.text)}</div><div class="why">${escapeHTML(q.text)} · Confidence ${a.confidence}%</div>`;
    list.append(item);
  });
  setTimeout(()=>document.querySelector(".back").onclick=()=>go("home"),0);
  return appShell(c);
}
function timeline(){
  const items=[...state.timeline].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const c=el("div");
  c.innerHTML=`<button class="back">← SELF</button><div class="kicker">YOUR TIMELINE</div><h1 style="font-size:34px;margin-top:18px">${items.length?"Твоя история уже началась.":"Пока здесь пусто."}</h1><div class="timeline" id="tl"></div>`;
  const tl=c.querySelector("#tl");
  items.slice(0,30).forEach((item,i)=>{
    const row=el("div","timeItem");
    row.innerHTML=`<div class="markerWrap"><div class="marker" style="${item.type==="SHIFT"?"background:var(--blue)":""}"></div>${i<items.length-1?'<div class="tline"></div>':""}</div>
      <div class="timeBody"><div class="date">${fmtDate(item.date)}</div><div class="title">${escapeHTML(item.title)}</div><div class="desc">${escapeHTML(item.desc||"")}</div></div>`;
    tl.append(row);
  });
  setTimeout(()=>document.querySelector(".back").onclick=()=>go("home"),0);
  return appShell(c);
}
function future(){
  const c=el("div");c.style.display="flex";c.style.flexDirection="column";c.style.minHeight="100%";
  c.innerHTML=`<button class="back">← SELF</button><div class="kicker">FUTURE ECHO</div>
  <div class="qscene"><div class="qtitle">Что ты хочешь сказать себе, которого ещё не существует?</div>
  <div class="qhint">Не совет. Не обещание. Просто мысль, которую важно не потерять.</div>
  <textarea id="futureText" placeholder="Например: «Если ты это читаешь, надеюсь, ты всё-таки...»"></textarea>
  <div class="futureChoices"><button class="futureChoice" data-days="30">1 month</button><button class="futureChoice" data-days="180">6 months</button><button class="futureChoice active" data-days="365">1 year</button></div></div>`;
  const b=el("button","cta","Запечатать");b.onclick=()=>{
    const txt=document.getElementById("futureText").value.trim();
    const chosen=document.querySelector(".futureChoice.active");
    if(!txt){showToast("Оставь сообщение.");return;}
    const days=Number(chosen.dataset.days), unlock=new Date(Date.now()+days*86400000);
    const futureRec={id:`f_${Date.now()}`,text:txt,createdAt:new Date().toISOString(),unlockAt:unlock.toISOString(),openedAt:null};
    state.futureEchoes.push(futureRec); syncFutureEcho(futureRec);
    state.timeline.unshift({id:`f_event_${Date.now()}`,type:"FUTURE",date:new Date().toISOString(),title:"Future Echo sealed",desc:`Откроется ${fmtDate(unlock)}`});
    saveState();showToast("Future Echo запечатан.");setTimeout(()=>go("home"),500);
  };c.append(b);
  setTimeout(()=>{
    document.querySelector(".back").onclick=()=>go("home");
    document.querySelectorAll(".futureChoice").forEach(x=>x.onclick=()=>{document.querySelectorAll(".futureChoice").forEach(y=>y.classList.remove("active"));x.classList.add("active")});
  },0);
  return appShell(c);
}
function escapeHTML(str=""){return str.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}

function render(route,opts={}){
  const root=document.getElementById("app"); root.innerHTML="";
  let node;
  switch(route){
    case "auth":node=authScreen();break;
    case "manifesto":node=manifesto();break;
    case "privacy":node=privacy();break;
    case "first":node=first();break;
    case "birth":node=birth();break;
    case "result":node=result();break;
    case "home":node=home();break;
    case "new-question":node=questionScreen(chooseNextQuestion());break;
    case "revisit":node=revisit();break;
    case "repeat":node=repeat(opts.id);break;
    case "compare":node=compare(opts);break;
    case "domain":node=domain(opts);break;
    case "timeline":node=timeline();break;
    case "future":node=future();break;
    default:node=welcome();
  }
  root.append(node);
}

async function boot(){
  const {data}=await sb.auth.getSession();
  currentUser=data.session?.user||null;
  const hash=location.hash.replace("#","")||"welcome";
  if(hash!=="welcome" && hash!=="auth" && !currentUser){render("auth");return;}
  if(currentUser) await prepareAccount();
  render(hash);
}
sb.auth.onAuthStateChange((_event,session)=>{currentUser=session?.user||null;});
boot();
</script></body></html>
